<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vpscan</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

  <style>
    .vb,
    #vanbtn,
    #ctbtn {
      height: 60px;
      font-weight: bold;
      font-size: 0.8em;
      padding: 2px;
    }
  </style>

  <script type="module">
    import jsbarcode from "https://esm.sh/jsbarcode";


    const bp = document.querySelector("#button-panel");
    const back = document.querySelector("#back");
    const svg = document.querySelector("#barcode");
    const vanbtn = document.querySelector("#vanbtn");
    const vanpage = document.querySelector("#vanpage");
    const vansave = document.querySelector("#vansave");
    const ctreg = document.querySelector("#ctreg");
    const vanreg = document.querySelector("#vanreg");

    const ctbtn = document.querySelector("#ctbtn");
    const ctpage = document.querySelector("#ctpage");
    const ctsave = document.querySelector("#ctsave");
    const addctbtn = document.querySelector("#addctbtn");
    const addtrbtn = document.querySelector("#addtrbtn");
    const clrbtn = document.querySelector("#clrbtn");
    const vanclrbtn = document.querySelector("#vanclrbtn");

    const btnfilterall = document.querySelector("#btnfilterall");
    const btnfilteramb = document.querySelector("#btnfilteramb");
    const btnfilterchl = document.querySelector("#btnfilterchl");
    const btnfilterfrz = document.querySelector("#btnfilterfrz");

    const canvas = document.querySelector("#barcode");

CanvasRenderingContext2D.prototype.clear = 
  CanvasRenderingContext2D.prototype.clear || function (preserveTransform) {
    if (preserveTransform) {
      this.save();
      this.setTransform(1, 0, 0, 1, 0, 0);
    }

    this.clearRect(0, 0, this.canvas.width, this.canvas.height);

    if (preserveTransform) {
      this.restore();
    }           
};

    function vibe() {
      if (navigator.vibrate)
        navigator.vibrate(100);
    }


    back.addEventListener("click", (event) => {
      vanpage.style.display = 'none';
      ctpage.style.display = 'none';
      bp.style.display = 'block';
      back.style.display = 'none';
      //svg.innerHTML = "";
  var ctx = canvas.getContext('2d');
ctx.setTransform(1, 0, 0, 1, 0, 0)
ctx.clearRect(0, 0, canvas.width, canvas.height)

      vibe();
    });



    addctbtn.addEventListener("click", (event) => {
      ctreg.value = "CT-" + ctreg.value;
      ctreg.focus();
      vibe();
    });

    addtrbtn.addEventListener("click", (event) => {
      ctreg.value = "TR" + ctreg.value;
      ctreg.focus();
      vibe();
    });

    clrbtn.addEventListener("click", (event) => {
      ctreg.value = "";
      ctreg.focus();
      vibe();
    });

    vanclrbtn.addEventListener("click", (event) => {
      vanreg.value = "";
      vanreg.focus();
      vibe();
    });

    vanbtn.addEventListener("click", (event) => {
      vanpage.style.display = 'block';
      bp.style.display = 'none';
      back.style.display = 'block';
      svg.innerHTML = "";
      vibe();

      if (localStorage.getItem("vanreg") != null) {
        document.querySelector("#vanreg").value = localStorage.getItem("vanreg");
        JsBarcode("#barcode", localStorage.getItem("vanreg"), {
          width: 3,
          height: 120,
        });
      }
    });

    ctbtn.addEventListener("click", (event) => {
      ctpage.style.display = 'block';
      bp.style.display = 'none';
      back.style.display = 'block';
      svg.innerHTML = "";
      vibe();

      if (localStorage.getItem("ctreg") != null) {
        document.querySelector("#ctreg").value = localStorage.getItem("ctreg");
        JsBarcode("#barcode", localStorage.getItem("ctreg"), {
          width: 3,
          height: 120,
        });
      }
    });

    ctsave.addEventListener("click", (event) => {
      var ctreg = document.querySelector("#ctreg").value;
      console.log("ctreg", ctreg);
      if (ctreg.length > 0) {
        let code = ctreg;
        vibe();

        localStorage.setItem("ctreg", code);
        JsBarcode("#barcode", code, {
          width: 3,
          height: 120,
        });
      }
    });

    function copybarcode() {
      canvas.toBlob(
        (blob) => {
          try {
            navigator.clipboard.write([
              new ClipboardItem({
                'image/png': blob
              })
            ]);
          } catch (error) {
            console.error(error);
          }
        },
        "image/png",
        1.0,
      );
    }

    ctcopy.addEventListener("click", (event) => {
      copybarcode();
    });
    vancopy.addEventListener("click", (event) => {
      copybarcode();
    });



    function runvansave() {
      var vanreg = document.querySelector("#vanreg").value;
      console.log("vanreg", vanreg);
      if (vanreg.length > 0) {
        let code = vanreg;

        localStorage.setItem("vanreg", vanreg);
        JsBarcode("#barcode", code, {
          width: 3,
          height: 120,
        });
      }
    }


    vanreg.addEventListener("input", (event) => {
      runvansave();
    });

    btnfilterall.addEventListener("click", (event) => {
      let elementsArray = document.querySelectorAll("#button-panel table td");
      elementsArray.forEach(function (elem) {
        elem.style.display = 'table-cell';

      });
      vibe();
    });

    btnfilteramb.addEventListener("click", (event) => {
      let elementsArray = document.querySelectorAll("#button-panel table td");
      elementsArray.forEach(function (elem) {
        elem.style.display = 'none';
      });


      let elementsArrayAmb = document.querySelectorAll(".amb");
      elementsArrayAmb.forEach(function (elem) {
        elem.style.display = 'table-cell';
      });
      vibe();
    });


    btnfilterchl.addEventListener("click", (event) => {
      let elementsArray = document.querySelectorAll("#button-panel table td");
      elementsArray.forEach(function (elem) {
        elem.style.display = 'none';
      });

      let elementsArrayChl = document.querySelectorAll(".chl");
      elementsArrayChl.forEach(function (elem) {
        elem.style.display = 'table-cell';
      });
      vibe();
    });

    btnfilterfrz.addEventListener("click", (event) => {
      let elementsArray = document.querySelectorAll("#button-panel table td");
      elementsArray.forEach(function (elem) {
        elem.style.display = 'none';
      });

      let elementsArrayFrz = document.querySelectorAll(".frz");
      elementsArrayFrz.forEach(function (elem) {
        elem.style.display = 'table-cell';
      });
      vibe();
    });







    let elementsArray = document.querySelectorAll(".vb");

    elementsArray.forEach(function (elem) {

      elem.addEventListener("click", (event) => {

        let code = "VP-" + event.target.innerHTML;
        bp.style.display = 'none';
        back.style.display = 'block';
        JsBarcode("#barcode", code, {
          width: 4,
          height: 120,
        });
        vibe();
      });
    });



  </script>
</head>

<body>

  <section class="section">
    <div class="container">
      <h1 class="title">
        VP Codes
      </h1>
      <p class="subtitle">
        Tool for generating <strong>VP Loading Codes</strong><br />&copy; Nick Jordan
      </p>
      <button class="button is-primary is-large  is-fullwidth" id="back" style="display:none;">Back</button><br />





      <div id="button-panel">
        <div class="level is-mobile">
          <div class="level-item">
            <button id="btnfilterall" class="button is-link is-fullwidth">ALL</button>
          </div>
          <div class="level-item">
            <button id="btnfilteramb" class="button is-link is-fullwidth">AMB</button>
          </div>
          <div class="level-item">
            <button id="btnfilterfrz" class="button is-link is-fullwidth">FRZ</button>
          </div>
          <div class="level-item">
            <button id="btnfilterchl" class="button is-link is-fullwidth">CHL</button>
          </div>


        </div>

        <button class="button is-fullwidth mb-4" id="vanbtn">VAN</button>
        <button class="button is-fullwidth mb-4" id="ctbtn">OTHER BARCODE</button>
        <table class="table is-fullwidth is-narrow">
          <tr>
            <td class="amb"><button class="button is-fullwidth vb">E1</button></td>
            <td class="amb"><button class="button is-fullwidth vb">E2</button></td>
            <td class="amb"><button class="button is-fullwidth vb">E3</button></td>
            <td class="amb"><button class="button is-fullwidth vb">E4</button></td>
            <td class="frz"><button class="button is-fullwidth vb is-info">E5</button></td>
            <td class="chl"><button class="button is-fullwidth vb is-success">E6</button></td>
            <td class="chl"><button class="button is-fullwidth vb is-success">E7</button></td>
          </tr>
          <tr>
            <td class="amb"><button class="button is-fullwidth vb">D1</button></td>
            <td class="amb"><button class="button is-fullwidth vb">D2</button></td>
            <td class="amb"><button class="button is-fullwidth vb">D3</button></td>
            <td class="amb"><button class="button is-fullwidth vb">D4</button></td>
            <td class="frz"><button class="button is-fullwidth vb is-info">D5</button></td>
            <td class="chl"><button class="button is-fullwidth vb is-success">D6</button></td>
            <td class="chl"><button class="button is-fullwidth vb is-success">D7</button></td>
          </tr>
          <tr>
            <td class="amb"><button class="button is-fullwidth vb">C1</button></td>
            <td class="amb"><button class="button is-fullwidth vb">C2</button></td>
            <td class="amb"><button class="button is-fullwidth vb">C3</button></td>
            <td class="amb"><button class="button is-fullwidth vb">C4</button></td>
            <td class="frz"><button class="button is-fullwidth vb is-info">C5</button></td>
            <td class="chl"><button class="button is-fullwidth vb is-success">C6</button></td>
            <td class="chl"><button class="button is-fullwidth vb is-success">C7</button></td>
          </tr>
          <tr>
            <td class="amb"><button class="button is-fullwidth vb">B1</button></td>
            <td class="amb"><button class="button is-fullwidth vb">B2</button></td>
            <td class="amb"><button class="button is-fullwidth vb">B3</button></td>
            <td class="amb"><button class="button is-fullwidth vb">B4</button></td>
            <td class="frz"><button class="button is-fullwidth vb is-info">B5</button></td>
            <td class="chl"><button class="button is-fullwidth vb is-success">B6</button></td>
            <td class="chl"><button class="button is-fullwidth vb is-success">B7</button></td>
          </tr>
          <tr>
            <td class="amb"><button class="button is-fullwidth vb">A1</button></td>
            <td class="amb"><button class="button is-fullwidth vb">A2</button></td>
            <td class="amb"><button class="button is-fullwidth vb">A3</button></td>
            <td class="amb"><button class="button is-fullwidth vb">A4</button></td>
            <td class="frz"><button class="button is-fullwidth vb is-info">A5</button></td>
            <td class="chl"><button class="button is-fullwidth vb is-success">A6</button></td>
            <td class="chl"><button class="button is-fullwidth vb is-success">A7</button></td>
          </tr>
        </table>
      </div>

      <div id="vanpage" style="display:none;">
        <input class="input is-large mb-5" type="text" id="vanreg" placeholder="VAN REGISTRATION" />

        <div class="columns is-mobile">
          <div class="column is-6">

            <button class="button is-danger  is-fullwidth" id="vanclrbtn">CLEAR</button><br />

          </div>
          <div class="column is-6">

            <button class="button is-info  is-fullwidth" id="vancopy">COPY</button><br />

          </div>

        </div>
      </div>



      <div id="ctpage" style="display:none;">


        <p class="control">
          <input class="input is-large mb-5 is-fullwidth" type="tel" id="ctreg" placeholder="1234567" />
        </p>

        <div class="columns is-mobile">
          <div class="column is-3">

            <button class="button is-danger  is-fullwidth" id="clrbtn">CLEAR</button><br />

          </div>
          <div class="column is-3">
            <button class="button is-warning is  is-fullwidth" id="addctbtn">CT-</button><br />

          </div>
          <div class="column is-3">

            <button class="button is-info  is-fullwidth" id="addtrbtn">TR</button><br />

          </div>
          <div class="column is-3">

            <button class="button is-info  is-fullwidth" id="ctcopy">COPY</button><br />

          </div>

        </div>




        <button class="button is-success is-large  is-fullwidth" id="ctsave">SAVE</button><br />
      </div>


      <center>
        <canvas id="barcode"></canvas>

      </center>


    </div>
  </section>

</body>

</html>
